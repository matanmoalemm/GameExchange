name: Build & Deploy

on:
  push:
    branches:
      - master

jobs:
  build:
    name: Build and Deploy app
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      #Set up JDK 21
      - name: Set up JDK21
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 21

      #Testing
      - name: Tests
        run: ./mvnw clean test --file pom.xml

      #Build JAR File
      - name: Build JAR File
        run: |
          ./mvnw clean
          ./mvnw -B package --file pom.xml
