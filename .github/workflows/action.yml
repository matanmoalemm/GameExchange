name: Build & Deploy

on:
  push:
    branches:
      - master

jobs:
  build:
    name: Build and Deploy app
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:latest
        env:
          POSTGRES_DB: mydata
          POSTGRES_USER: matan
          POSTGRES_PASSWORD: password
        ports:
          - 5332:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      #Set up JDK 21
      - name: Set up JDK21
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 21

      - name: Make mvnw executable
        run: chmod +x mvnw

      #Testing
      - name: Tests
        run: ./mvnw clean test --file pom.xml

      #Build JAR File
      - name: Build JAR File
        run: |
          ./mvnw clean
          ./mvnw -B package --file pom.xml -DskipTests
