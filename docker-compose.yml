services:
  db:
    container_name: postgres
    image: postgres:latest
    environment:
      POSTGRES_USER: amigoscode
      POSTGRES_PASSWORD: password
      PGDATA: /data/postgres
    volumes:
      - db:/data/postgres
    ports:
      - "5332:5432"
    networks:
      - db
    restart: unless-stopped
  mongo:
    image: mongo
    ports:
      - 27017:27017

networks:
  db:
    driver: bridge

volumes:
  db: