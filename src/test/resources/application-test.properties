# Connect to the local PostgreSQL instance (running at localhost:5332 as per CLAUDE.md)
spring.datasource.url=jdbc:postgresql://localhost:5332/mydata
spring.datasource.username=matan
spring.datasource.password=password
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Override so tests don't require JWT_SECRET env var
app.jwtSecret=integration-test-secret-key-min-32-chars!!
app.jwtExpirationMs=86400000

# SecurityConfig reads ${FRONTEND_URL} via @Value — must be set to prevent startup failure
FRONTEND_URL=http://localhost:3000

# Override so tests don't require GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET env vars
spring.security.oauth2.client.registration.google.client-id=test-client-id
spring.security.oauth2.client.registration.google.client-secret=test-client-secret
